services:
  api:
    build: .
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      APP_PORT: 8080
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
